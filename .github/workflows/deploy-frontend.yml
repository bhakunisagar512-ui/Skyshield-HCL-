# Builds the React frontend and publishes it to GitHub Pages.
# Runs on every push to main that touches frontend/, or manually from the Actions tab.
# One-time setup: Settings → Pages → Source: "GitHub Actions",
# and Settings → Secrets and variables → Actions → Variables → VITE_API_URL = your Render API address.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the API address is set
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Set the repository variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
