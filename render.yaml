# Render Blueprint: creates the PostgreSQL database and the FastAPI web service.
# Render dashboard → New → Blueprint → pick this repository.
# You will be asked for the values marked sync: false.

databases:
  - name: skyshield-db
    plan: free                 # free databases expire after 30 days
    databaseName: skyshield
    user: skyshield
    postgresMajorVersion: "16"

services:
  - type: web
    name: skyshield-api
    runtime: python
    plan: free                 # sleeps after 15 min idle; first request then takes ~1 min
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrations run on every deploy (also enables pgvector), then the API starts
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: skyshield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # e.g. https://bhakunisagar512-ui.github.io
      - key: LLM_PROVIDER
        value: anthropic       # or "mock" to run without an API key
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
