services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skyshield
      POSTGRES_PASSWORD: skyshield
      POSTGRES_DB: skyshield
    ports:
      - "5433:5432"
    volumes:
      - skyshield_pg:/var/lib/postgresql/data
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  skyshield_pg:
